services:
  app:
    build: .
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in .env before starting Compose}"
      METADATA_DIR: /srv/medienserver-data/metadata
      VIDEO_DIR: /srv/medienserver-data/videos
      THUMBNAIL_DIR: /srv/medienserver-data/thumbnails
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-2048}"
      FFPROBE_PATH: /usr/bin/ffprobe
      FFMPEG_PATH: /usr/bin/ffmpeg
    volumes:
      - ./data/videos:/srv/medienserver-data/metadata
      - ./uploads/videos:/srv/medienserver-data/videos
      - ./uploads/thumbnails:/srv/medienserver-data/thumbnails
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./deployment/nginx-compose.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/srv/medienserver-static:ro
      - ./uploads/videos:/srv/medienserver-data/videos:ro
      - ./uploads/thumbnails:/srv/medienserver-data/thumbnails:ro
    restart: unless-stopped
